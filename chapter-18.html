terms:[["Land annuities","Repayments of loans given to Irish farmers by Britain to buy their farms."],["Tariff","A tax on goods coming into a country."],["The Economic War","The trade dispute between Ireland and Britain from 1932 to 1938 over the land annuities."],["Oath of allegiance","A promise of loyalty to the British monarch that TDs had to take."],["Bunreacht na hÉireann","The Irish Constitution passed in 1937."],["Treaty ports","Cobh, Lough Swilly and Berehaven, returned to Ireland in 1938."]],
steps:[
{type:"brief",cards:[
{t:"File 1: Cumann na nGaedheal’s record",body:"<p>Cumann na nGaedheal governed until 1932. Its biggest challenge after the Civil War was restoring law and order after years of bitter conflict.</p><ul><li>It set up <b>An Garda Síochána</b> in 1925.</li><li>It began to modernise the country with a <b>hydroelectric scheme at Ardnacrusha</b> on the River Shannon in 1929.</li><li>It founded the <b>Electricity Supply Board (ESB)</b>.</li></ul>",q:"Which of these was a Cumann na nGaedheal achievement?",o:["Passing Bunreacht na hÉireann","Building the hydroelectric scheme at Ardnacrusha","Ending the Economic War"],a:1,why:"Ardnacrusha (1929), the ESB and An Garda Síochána (1925) are the three successes to learn."},
{t:"File 2: Why Cumann na nGaedheal lost support",body:"<ul><li>The country was still heavily reliant on agriculture and had little industry.</li><li>From 1929, the <b>Great Depression</b> hit the whole Western world, increasing unemployment, poverty and emigration.</li><li>The party had made no progress in dismantling the terms of the Anglo-Irish Treaty.</li><li>It kept introducing unpopular <b>Public Safety Acts</b> to support law and order.</li></ul>",q:"Which of these was NOT a reason Cumann na nGaedheal became unpopular?",o:["The Great Depression increased unemployment","It made no progress dismantling the Treaty","It refused to set up a police force","Its Public Safety Acts were unpopular"],a:2,why:"It did set up a police force: An Garda Síochána was one of its successes."},
{t:"File 3: The rise of Fianna Fáil",body:"<p><b>Fianna Fáil</b> was founded by <b>Éamon de Valera</b> in 1926 after he left Sinn Féin. Frank Aiken and Seán Lemass joined him. The party was highly organised and on the rise.</p><p>After <b>Kevin O’Higgins</b> was assassinated in 1927, W. T. Cosgrave introduced the <b>Electoral Amendment Act</b>. All elected TDs now had to take the oath of allegiance to the British monarch or give up their seats. De Valera and Fianna Fáil decided to take the oath.</p><p>Fianna Fáil won the most seats in the 1932 general election and, with the help of Labour, entered government.</p>",q:"What did the Electoral Amendment Act require?",o:["All elected TDs had to take the oath of allegiance or give up their seats","Elections had to take place every two years","Only Cumann na nGaedheal could form a government"],a:0,why:"This forced Fianna Fáil to choose: take the oath or stay out of the Dáil. They took it, and entered the Dáil."},
{t:"File 4: Dismantling the Treaty",body:"<ul><li>The <b>oath of allegiance was removed in 1933</b>. The <b>Statute of Westminster</b> allowed Commonwealth countries to pass laws without interference from Britain.</li><li>The position of governor-general was sidelined.</li><li>References to the British monarch were removed from the Irish Constitution in 1936.</li></ul>",q:"What made it possible for Ireland to remove the oath without British interference?",o:["The Statute of Westminster","The Emergency Powers Act","The Electoral Amendment Act"],a:0,why:"The Statute of Westminster let Commonwealth countries pass their own laws without interference from Britain."},
{t:"File 5: A new constitution, 1937",body:"<p><b>Bunreacht na hÉireann</b> was passed in 1937. It stated that:</p><ul><li>the country was now to be called <b>Éire or Ireland</b></li><li>the prime minister was to be called the <b>Taoiseach</b></li><li>the head of the country was to be a <b>President</b> (Douglas Hyde became the first President of Ireland)</li><li><b>Irish</b> was the official language</li><li>it claimed the right to control the entire island of Ireland.</li></ul>",q:"Who became the first President of Ireland?",o:["Éamon de Valera","Douglas Hyde","W. T. Cosgrave"],a:1,why:"Douglas Hyde. De Valera was head of government, not President, at this time."},
{t:"File 6: The Economic War, 1932 to 1938",body:"<p>De Valera stopped paying Britain the <b>land annuities</b>, the repayments of loans given to Irish farmers by Britain to buy their farms.</p><p>Britain responded with a <b>20% tariff</b> on all Irish agricultural goods. This caused great hardship, because <b>83%</b> of Irish exports went to Britain. De Valera retaliated with a <b>5% tariff</b> on British goods.</p><p>It ended with the <b>Anglo-Irish Agreement</b> in 1938:</p><ul><li>the land annuities were abolished, with a once-only payment of £10 million</li><li>tariffs were reduced</li><li>the Treaty ports of <b>Cobh, Lough Swilly and Berehaven</b> were returned to Ireland.</li></ul>",q:"Why did the Economic War hit Irish farmers so hard?",o:["83% of Irish exports went to Britain","Farmers had to pay the 5% tariff","Britain stopped buying all Irish goods completely"],a:0,why:"Britain was by far Ireland’s biggest market, so a 20% tariff on farm goods did serious damage."},
{t:"File 7: Changes at home",body:"<ul><li><b>Welfare payments</b> were introduced for widows and orphans in 1933, and unemployment assistance in 1935.</li><li><b>Ten thousand more houses</b> were built than during Cumann na nGaedheal’s time in government.</li><li>The <b>IRA was banned</b> in 1936, and 500 members were imprisoned in 1939 after they began bombing Britain.</li></ul>",q:"What happened to the IRA in 1936?",o:["It joined Fianna Fáil","It was banned","It was given seats in the Dáil"],a:1,why:"Banned in 1936. In 1939, 500 members were imprisoned after bombings in Britain.",
dyk:"<b>Éamon de Valera (1882 to 1975)</b> was born in New York to a Spanish father and an Irish mother, and raised by his grandmother in Limerick. He commanded the garrison at Boland’s Mills in 1916 and was sentenced to death, later changed to life in prison. He led Fianna Fáil, created the 1937 Constitution, and was President of Ireland from 1959 to 1973."}
]},

["The oath of allegiance was removed (1933)",0],["The governor-general was sidelined",0],["References to the British monarch removed (1936)",0],["The country renamed Éire or Ireland",1],["The head of government called the Taoiseach",1],["Irish made the official language",1],["Land annuities stopped",2],["A 5% tariff placed on British goods",2],["The Treaty ports returned (1938)",2],["Welfare payments for widows and orphans",3],["Ten thousand more houses built",3]]},
{type:"write",title:"The sources",lede:"Open your textbook at page 249 and look at the two 1932 election posters, then answer.",extract:"<p><b>Poster A (Cumann na nGaedheal):</b> A large dark shadow of a gunman falls over a small country cottage. The slogan reads ‘The Shadow of the Gunman. Keep it from your home. Vote for Cumann na nGaedheal’.</p><p><b>Poster B (Fianna Fáil):</b> Plain bold text: ‘Mr Cosgrave will think more about the unemployed after the elections. He’ll be one of them.’</p>",qs:[
["What message is the Cumann na nGaedheal poster trying to give voters?","That voting for Cumann na nGaedheal would keep violence away from people’s homes. It suggests that Fianna Fáil were linked to the gunmen of the Civil War."],
["What issue does the Fianna Fáil poster focus on?","Unemployment. It claims Cosgrave ignored the unemployed and jokes that he will lose his own job after the election."],

["Why should a historian be careful when using election posters as evidence?","They are propaganda. They are one-sided and were designed to win votes, not to give a fair picture."]]},
{type:"write",title:"Your report",report:true,lede:"These are the Checkpoint questions from your textbook. Answer in full sentences, then check.",qs:[
["Give two successes of the Cumann na nGaedheal government.","It set up An Garda Síochána in 1925 and built the hydroelectric scheme at Ardnacrusha in 1929. It also founded the ESB."],

]},

{ref:"18.2",title:"The Censor’s Desk",sub:"Neutrality and the Emergency Powers Act",role:"It is 1942. You are a new clerk in the Government’s censorship office in Dublin.",from:"From: Mr P. Kinsella, Assistant Censor (a fictional character)",
terms:[["Neutrality","Not fighting in a war and not supporting either side."],["Censorship","Controlling or blocking what can be published or sent, such as news, books, plays or letters."],["Propaganda","Information, often one-sided or misleading, used to persuade people to support a cause."],["Emergency Powers Act","The 1939 law giving the Irish government special powers to keep the country neutral."],["The Allies","Britain, France and the United States: the side Ireland quietly favoured."],["The Emergency","The name for the effect of World War II on Ireland between 1939 and 1945."]],
steps:[
{type:"brief",cards:[
{t:"Memo 1: The position of this State",body:"<p>You start at this desk today, so read this carefully.</p><p>World War II broke out in September 1939. The Government declared that Ireland would be <b>neutral</b>. Neutrality means not fighting in a war and not supporting either side.</p><p>The job of this office is to make sure nothing printed or posted in this country makes Ireland look as if it supports one side.</p>",q:"Which of these best describes neutrality?",o:["Not fighting in a war and not supporting either side","Fighting only if your country is attacked","Supporting whichever side is most likely to win"],a:0,why:"Neutrality has two parts: no fighting, and no support for either side. You need both in an exam answer."},
{t:"Memo 2: Why we stay out",body:"<p>The Government has four reasons for staying neutral:</p><ul><li>It shows that Ireland is independent from Britain.</li><li>Ireland is ill-prepared to fight in a war.</li><li>Ireland’s economy is weak and would be further damaged by war.</li><li>Staying out is popular with all political parties.</li></ul>",q:"Which of these was NOT a reason for Irish neutrality?",o:["Ireland was ill-prepared to fight in a war","Ireland had promised to support Germany","Neutrality showed independence from Britain","All political parties supported staying out"],a:1,why:"Ireland made no promise to Germany. The four real reasons are independence, being ill-prepared, a weak economy and support from all parties."},
{t:"Memo 3: Neutral, but not entirely",body:"<p>Officially, Ireland takes no side. In practice, the Government quietly favours the <b>Allies</b>: Britain, France and the United States.</p><ul><li>Allied planes may fly over Donegal from Northern Ireland.</li><li>Weather reports and sightings of U-boats and German ships are passed to the Allies.</li><li>German airmen caught here are imprisoned. British and American airmen are allowed to ‘escape’ over the border.</li><li>Irish fire brigades went to Belfast to help after the German bombings.</li><li>Around 50,000 Irishmen have joined the British army.</li></ul><p>‘ÉIRE’ has been marked in huge letters on the coastline so German bombers will not mistake Ireland for Britain.</p><p>None of this appears in the newspapers.</p>",q:"Which of these is evidence that Ireland favoured the Allies?",o:["Irish newspapers printed pro-British headlines","German airmen were imprisoned, but British and American airmen could ‘escape’ over the border","The Irish army was officially sent to fight for Britain"],a:1,why:"Newspapers were censored, so they could not show support for Britain, and the Irish army never fought. The 50,000 Irishmen who joined the British army did so as individuals."},
{t:"Memo 4: Your powers",body:"<p>This period is known as <b>the Emergency</b>, named after the <b>Emergency Powers Act 1939</b>. Under it, the Government can go to great lengths to keep Ireland neutral.</p><ul><li>Newspapers are strictly censored. They may not print any news that might show a bias towards either side.</li><li>Plays, poetry and books are censored too.</li><li>Even people’s post can be opened and examined.</li></ul><p>That is where you come in.</p>",q:"Why was this period in Ireland called ‘the Emergency’?",o:["Because of the bombing of the North Strand","It was named after the Emergency Powers Act 1939","Because the IRA declared a state of emergency"],a:1,why:"The name comes from the law itself: the Emergency Powers Act 1939.",dyk:"In June 1940, Winston Churchill suggested to de Valera that a united Ireland might come about in return for Ireland’s support in the war. De Valera rejected the offer. He did not believe it was genuine, or that unionists would accept it."}
]},
{type:"terms",title:"Key terms"},
{type:"desk",title:"The desk",items:[
{k:"Headline, Dublin evening newspaper",t:"GALLANT RAF PILOTS SMASH NAZI RAIDERS OVER LONDON",c:true,r:["It shows bias towards Britain","It is about a foreign country","All news about planes was banned"],ra:0,x:"Words like ‘gallant’ and ‘Nazi raiders’ take Britain’s side. A neutral newspaper could only report the war in plain, balanced terms."},
{k:"Advertisement, Clare newspaper",t:"Céilí in the Town Hall, Ennis. Saturday at 9 p.m. Admission one shilling.",c:false,r:["It is ordinary local news with no link to the war","Adverts were never checked","It supports the Government"],ra:0,x:"Most of what crossed a censor’s desk was harmless. Censorship was about the war, not about blocking everything."},
{k:"Weather forecast, morning newspaper",t:"Tonight: clear skies over the east coast, light winds, good visibility at sea.",c:true,r:["It might upset farmers","It could help enemy bombers or U-boats","It shows bias towards Germany"],ra:1,x:"Weather information is useful to bombers and submarines, so it was kept out of the papers. Yet the Government secretly passed weather reports to the Allies, more evidence that it favoured them."},
{k:"Headline, national newspaper",t:"TAOISEACH: IRELAND WILL REMAIN NEUTRAL. OIREACHTAS UNANIMOUS.",c:false,r:["It is foreign news","It reports Government policy and takes no side","Headlines about the Taoiseach were always passed"],ra:1,x:"This is based on a real headline from September 1939, shown in your textbook on page 251. Reporting neutrality was exactly what the Government wanted."},
{k:"Private letter, opened at the Post Office",t:"Dear Mam, things are quiet here in Cork. The lads say the army is moving the big guns down to the harbour next week. Don’t tell anyone. Your loving son, Tom.",c:true,r:["Private letters could never be sent","It criticises the army","It reveals military information"],ra:2,x:"Under the Act, post could be opened and examined. Details about defences could reach a foreign spy, so this line would be cut out before delivery."},
{k:"Headline, farming newspaper",t:"MEATH FARMERS SOW RECORD ACRES OF WHEAT UNDER TILLAGE SCHEME",c:false,r:["It shows bias towards the Allies","It is home news and takes no side in the war","Farming news was always banned"],ra:1,x:"News about Ireland coping with shortages took no side. You will meet the Compulsory Tillage Scheme in 18.3."},
{k:"Headline, Dublin morning newspaper",t:"GERMAN ARMY’S GLORIOUS MARCH THROUGH THE STREETS OF PARIS",c:true,r:["It shows bias towards Germany","It is about France","Paris could not be mentioned"],ra:0,x:"Censorship worked against both sides. ‘Glorious’ praises Germany, so this breaks neutrality just as much as a pro-British headline."},
{k:"Poem submitted to a literary magazine",t:"England stands alone and true,\nHer flag against the darkened sky;\nWho would not march where she has gone,\nAnd for her freedom fight and die?",c:true,r:["Poems were never allowed during the war","It is propaganda encouraging people to support Britain","It is badly written"],ra:1,x:"Poetry was censored too. This poem tries to persuade readers to fight for Britain, which makes it propaganda."}]},
{type:"write",title:"The source",lede:"This is part of the real Emergency Powers Act 1939 (textbook page 252). It is the law that gave your office its powers. Read it, then answer each question before checking.",extract:"<p>… the Government may do by an emergency order all or any of the following things …</p><p>(h) authorise and provide for the censorship, restriction, control, or partial or complete suspension of communication by means of all or one or more of the services maintained or controlled by the Minister for Posts and Telegraphs …</p><p>(i) … prohibiting the publication or spreading of subversive statements and propaganda, and authorise and provide for the control and censorship of newspapers and periodicals;</p><p>(j) authorise and provide for the prohibition, restriction, or control of the entry or departure of persons into or out of the State …</p><p>(l) authorise the arrest without warrant of persons (other than natural-born Irish citizens) whose detention has been ordered or directed by a Minister …</p>",qs:[
["What type of source is this?","A primary, written source. It is an official government document (a law)."],
["What minister was responsible for communications during the Emergency?","The Minister for Posts and Telegraphs."],
["List four things the government may do during the Emergency, according to the source.","Any four: censor or suspend communications; control the publication of official information; prohibit the spreading of propaganda; control newspapers; control people entering or leaving the State; detain people; arrest people without a warrant."],
["Explain what propaganda is in your own words.","Information, often one-sided or misleading, that is spread to persuade people to support a cause."],
["Why do you think the Irish government wanted to prohibit the spreading of propaganda?","Propaganda could turn Irish people towards one side. That would damage neutrality and could drag Ireland into the war."],
["Give one benefit and one limitation of this source.","Benefit: it is a primary source showing the exact powers the government gave itself. Limitation: it does not show how often these powers were actually used, or what ordinary people thought of them."]]},
{type:"write",title:"Your report",report:true,lede:"These are the Checkpoint questions from your textbook. Answer in full sentences, then check.",qs:[
["Explain the term neutrality.","Not fighting in a war and not supporting either side."],
["Why did Ireland stay neutral during World War II?","To show independence from Britain; Ireland was ill-prepared to fight; the economy was weak and would be damaged further; staying out was popular with all political parties."],
["What evidence is there that Ireland favoured the Allied side?","Allied planes could fly over Donegal; weather reports and U-boat sightings were passed to the Allies; German airmen were imprisoned while British and Americans could ‘escape’ over the border; Irish fire brigades helped Belfast; around 50,000 Irishmen joined the British army."],
["What changes were introduced by the Emergency Powers Act 1939?","The government could go to great lengths to keep Ireland neutral: newspapers were strictly censored, plays, poetry and books were censored, and private post could be opened."],
["Why do you think strict censorship was introduced during World War II in Ireland?","So that no news could show a bias towards either side. Ireland had to be seen to be neutral, and censorship also protected military information."]]},

{ref:"18.3",title:"Life in Éire",sub:"Shortages, rationing, glimmer men and bombs",role:"It is 1942. You work in the Department of Supplies in Dublin, answering letters from the public about shortages.",from:"From: Department of Supplies information office",
terms:[["Rationing","Limiting the goods that people could buy to a fixed amount."],["Ration book","A book of coupons that could be exchanged for goods in shops."],["Glimmer man","A government inspector who checked that people were not overusing gas."],["Compulsory Tillage Scheme","Rule that all farmers had to till a certain amount of land and sow a certain acreage of wheat."],["Irish Shipping Company","Company set up by Lemass to transport goods to and from Ireland in 15 cargo ships."],["Minister for Supplies","Seán Lemass’s role: making sure Ireland had enough essentials in wartime."]],
steps:[
{type:"brief",cards:[
{t:"Notice 1: Why there are shortages",body:"<p>Ireland relies on imports of food, fuel and other items. German submarines are stopping British ships bringing supplies to and from Britain, which affects imports and exports to Ireland.</p><p><b>Seán Lemass</b> has been appointed <b>Minister for Supplies</b>. His job is to make sure Ireland has enough essentials to keep functioning. He set up the <b>Irish Shipping Company</b> to transport goods to Ireland in 15 cargo ships. Fuel and some foods still remain in short supply.</p>",q:"Why did Lemass set up the Irish Shipping Company?",o:["To transport goods to and from Ireland during the war","To carry Irish soldiers to Britain","To export turf to Britain"],a:0,why:"With British ships under attack, Ireland needed its own ships to bring in supplies."},
{t:"Notice 2: Rationing",body:"<p>Lemass introduced the <b>Compulsory Tillage Scheme</b>: all farmers had to till a certain amount of land and sow a certain acreage of wheat.</p><p>Limits were placed on food, clothes, footwear and so forth. People were given <b>ration books</b> containing coupons that could be exchanged for goods in shops. <b>Rationing</b> limited the goods people could buy to a fixed amount.</p><p>Tea, flour, butter, sugar and other essentials were hard to get. People dried out and reused their tea leaves.</p>",q:"Which is the correct definition of rationing?",o:["Limiting the goods that people could buy to a fixed amount","Banning all imports from Britain","Giving free food to poor families"],a:0,why:"This is the textbook definition. Learn it word for word."},
{t:"Notice 3: Fuel and the glimmer men",body:"<p>Electricity and gas were in short supply and rationed. Inspectors called <b>glimmer men</b> called to houses in towns and cities to check that people were not overusing gas. If you used more than your allowance, you could be cut off or prosecuted.</p><p><b>Petrol</b> was extremely limited, and was only really used by doctors and priests.</p><p>Coal from Britain was hard to get, so <b>turf</b> replaced it. The army was put to work cutting turf on bogs around Ireland. Trains ran on turf and took longer to reach their destinations.</p>",q:"What was the job of a glimmer man?",o:["Checking that people were not overusing gas","Checking that lights were turned off during air raids","Delivering turf to houses"],a:0,why:"Gas was rationed, and glimmer men checked that households kept to their allowance."},
{t:"Notice 4: Jobs and farms",body:"<p>Irish industry was greatly affected by the fuel shortages. Factories had to lay off workers, so <b>emigration</b> increased. People moved to Britain to work in its busy factories.</p><p>Agriculture was also affected by a lack of products such as fertilisers and animal feeds.</p>",q:"Why did emigration from Ireland increase during the Emergency?",o:["Fuel shortages forced factories to lay off workers","The government forced people to leave","Farmers were paid to move to Britain"],a:0,why:"No fuel meant no production, so workers lost their jobs and went to work in British factories."},
{t:"Notice 5: Bombs on a neutral country",body:"<p>Despite its neutrality, Ireland was bombed by the Germans, probably by accident.</p><ul><li>1940: bombs at <b>Campile, Co. Wexford</b> killed 3 people.</li><li>1941: a house in <b>Knockroe, Co. Carlow</b> was destroyed, killing three people and injuring two others.</li><li>1941: bombs on the <b>North Strand in Dublin</b> killed 28 people. This was the most fatal attack.</li></ul><p>The Germans claimed these were accidents, but the North Strand bombing may have been a message to the Irish government about the consequences of any involvement in the war.</p>",q:"Which was the most fatal German bombing in Éire?",o:["Campile, Co. Wexford","Knockroe, Co. Carlow","The North Strand, Dublin"],a:2,why:"The North Strand bombing in 1941 killed 28 people."}
]},
{type:"terms",title:"Key terms"},
{type:"seq",title:"A year in the Emergency",lede:"You are a teenager living in Dublin in 1941 and 1942. Decide what happens next in each situation.",items:[
{k:"At the shop",t:"Your mother sends you to the shop for sugar and tea. Money alone will not be enough.",q:"What else must you bring?",o:["The family’s ration book, so the shopkeeper can take the coupons","A letter from the parish priest","Nothing: sugar and tea were not rationed"],a:0,x:"You had to register with a shopkeeper for sugar, tea and butter, and hand over the ration book."},
{k:"In the kitchen",t:"The tea ration has run low and there are days to go until the next coupons.",q:"What did many families do?",o:["Dried out and reused their tea leaves","Bought tea from Germany","Gave up tea completely"],a:0,x:"Reusing tea leaves is one of the most remembered details of the Emergency."},
{k:"A knock at the door",t:"It is evening. A man from the Gas Company is at the door and asks to feel the gas ring on the cooker.",q:"Who is he, and why does it matter?",o:["A glimmer man. If the ring is warm outside permitted hours, the gas could be cut off","A Garda looking for IRA members","A census official counting the family"],a:0,x:"Glimmer men checked for overuse. A warm ring was evidence. Families could be cut off or prosecuted."},
{k:"A trip west",t:"Your uncle wants to drive to Galway for a family wedding.",q:"Can he get petrol?",o:["Very unlikely: petrol was mainly used by doctors and priests","Yes: petrol was never rationed","Yes, if he joins the army"],a:0,x:"Private cars were mostly off the road. Many people cycled or used a pony and trap."},
{k:"On the train",t:"You take the train to Cork instead. The journey takes far longer than it used to.",q:"Why?",o:["Trains were running on turf instead of coal","The army had taken over the railways","German bombs had damaged every line"],a:0,x:"Coal from Britain was scarce, and turf burns less efficiently."},
{k:"Bad news",t:"Your father’s factory cannot get enough fuel and starts laying off workers.",q:"What did many Irish workers in this position do?",o:["Emigrated to work in busy British factories","Joined the German army","Moved to the United States for free"],a:0,x:"Emigration increased during the Emergency as British war factories needed workers."},
{k:"Your cousin’s farm",t:"Your cousin farms in Co. Meath. A letter arrives from the Department of Agriculture.",q:"What does the Compulsory Tillage Scheme require him to do?",o:["Till a certain amount of land and sow a certain acreage of wheat","Sell all his cattle to Britain","Stop farming until the war ends"],a:0,x:"Ireland had to grow more of its own food, especially wheat for bread."},
{k:"31 May 1941",t:"In the early hours, German bombs fall on the North Strand in Dublin.",q:"What was the result?",o:["28 people were killed, the most fatal attack in Éire","No one was hurt","Ireland declared war on Germany"],a:0,x:"Germany claimed it was an accident. Ireland stayed neutral, but some saw the attack as a warning."}]},
{type:"write",title:"The source",lede:"Read this extract from a 1944 ration book (textbook page 254), then answer.",extract:"<p><b>YOUR RATION BOOK.</b> … If you are the Head of a Household and you receive a ration book not containing Householder’s Folder (pages 49 to 51), you should write immediately to the Department of Supplies, Ballsbridge, Dublin, for the folder …</p><p><b>Head of Household.</b> For rationing purposes, the Head of a Household means a person who holds or occupies a house, or part of a house … as his or her own dwelling and that of his or her household, including family, servants and guests …</p><p><b>Sugar, Tea and Butter.</b> You must register with a shopkeeper in order to draw your rations of sugar; registration is necessary also to obtain rations of tea and butter.</p><p><b>Soap.</b> Every time you purchase soap you should hand your ration book to the shopkeeper to enable him to cut out the appropriate coupon.</p>",qs:[
["What type of source is this?","A primary, written source. It is an official government document from 1944."],
["According to the source, where was the Department of Supplies based?","Ballsbridge, Dublin."],
["How is the head of a household defined?","A person who holds or occupies a house, or part of a house, as their own home and the home of their household, including family, servants and guests."],
["What food items are mentioned in the source?","Sugar, tea and butter."],
["What should you do if buying soap?","Hand your ration book to the shopkeeper so that he can cut out the right coupon."],
["Give two benefits of a source such as this for historians.","It is a primary source from the time, so it shows exactly how rationing worked. It is an official government document, so it is reliable about the rules people had to follow."]]},
{type:"write",title:"Your report",report:true,lede:"These are the Checkpoint questions from your textbook. Answer in full sentences, then check.",qs:[
["Explain the term rationing.","Limiting the goods that people could buy to a fixed amount."],
["What role did Seán Lemass have during the Emergency?","He was Minister for Supplies. He had to make sure Ireland had enough essentials. He set up the Irish Shipping Company, introduced the Compulsory Tillage Scheme and brought in rationing."],
["What was the purpose of the Irish Shipping Company?","To transport goods to and from Ireland, because German submarines were stopping British ships that normally brought supplies."],
["How were people’s lives affected by (a) rationing of food, (b) shortages of fuel and (c) bombing attacks?","(a) People used ration books; tea, flour, butter and sugar were hard to get, and tea leaves were reused. (b) Gas was checked by glimmer men, petrol was only for doctors and priests, turf replaced coal, trains were slower and factories laid off workers, increasing emigration. (c) Bombs killed people at Campile (1940), Knockroe (1941) and the North Strand, Dublin (1941), where 28 died."]]},

{ref:"18.4",title:"Northern Ireland at war",sub:"Industry, troops and the Belfast Blitz",role:"Northern Ireland, as part of the United Kingdom, fought on Britain’s side. You are reading reports from Belfast between 1939 and 1945.",from:"Report from Belfast",
terms:[["Conscription","Being forced by law to join the armed forces. It was not compulsory in Northern Ireland."],["Luftwaffe","The German air force."],["Belfast Blitz","The four German bombing raids on Belfast in April and May 1941."],["U-boat","A German submarine."],["Harland and Wolff","The Belfast shipyard that built warships and merchant ships."],["Short Brothers","The Belfast aircraft factory."]],
steps:[
{type:"brief",cards:[
{t:"Report 1: Industry booms",body:"<p>As part of the United Kingdom, Northern Ireland fought on Britain’s side. <b>Conscription was not compulsory, but rationing was.</b></p><p>Northern Irish industries had struggled after World War I, but from 1939 they boomed. <b>Harland and Wolff</b> (a shipyard) and <b>Short Brothers</b> (an aircraft factory) played key roles in the war.</p><ul><li>Between 1939 and 1945, Belfast produced 140 warships, 123 merchant ships and 1,600 aircraft.</li><li>Parachutes, ropes, uniforms, tanks and shells were made in Northern Ireland.</li><li>Unemployment dropped to only 5%.</li></ul>",q:"What did Short Brothers make?",o:["Warships","Aircraft","Parachutes"],a:1,why:"Short Brothers made aircraft. Harland and Wolff built ships.",dyk:"During World War II, the workforce of Harland and Wolff tripled to approximately 35,000 workers."},
{t:"Report 2: Farming does well",body:"<p>Agriculture in Northern Ireland also benefited.</p><ul><li>Prices were guaranteed for food on the British market.</li><li>In 1941, over 17,000 gallons of milk were exported to Britain every day.</li><li>Compulsory tillage farming increased the land used for growing flax, oats and potatoes.</li><li>Even some golf courses were used for tillage farming.</li></ul>",q:"Why did farmers in Northern Ireland benefit from the war?",o:["Prices were guaranteed for their food on the British market","They no longer had to pay any taxes","They were paid not to farm"],a:0,why:"Guaranteed prices meant farmers knew they could sell everything they produced."},
{t:"Report 3: A base for troops",body:"<p>Planes and boats based in Northern Ireland patrolled the Atlantic and searched for German U-boats, helping to protect supplies travelling between the islands.</p><p>Northern Ireland became an important base for <b>US troops</b> once the United States entered the war in December 1941. They were either protecting trade across the Atlantic or preparing for the Allied invasion of Normandy. Roads and ports had to be improved to cope with the traffic. At one stage there were <b>120,000 US troops</b> in Northern Ireland.</p>",q:"Why were US troops stationed in Northern Ireland?",o:["To invade Éire","To protect Atlantic trade and prepare for the invasion of Normandy","To work in the shipyards"],a:1,why:"Northern Ireland was the closest part of the UK to the Atlantic routes from America."},
{t:"Report 4: The Belfast Blitz",body:"<p>Because of its industry, Belfast was one of the major targets for the German military. It was not well defended, because the government thought it was too far away for the German bombers (the Luftwaffe) to reach.</p><p>Belfast was bombed four times in April and May 1941. This was the <b>Belfast Blitz</b>.</p><ul><li>Factories such as Harland and Wolff were seriously damaged.</li><li>About <b>1,100 people</b> were killed.</li><li>Over <b>56,000 homes</b> were destroyed.</li><li>Many people left for towns outside Belfast, and some took refuge south of the border.</li></ul><p>Fire brigades from Éire crossed the border to help.</p>",q:"Why was Belfast so poorly defended?",o:["The government thought it was too far for German bombers to reach","All the soldiers were in Dublin","Belfast was neutral"],a:0,why:"This miscalculation is one reason the death toll was so high."}
]},

{ref:"18.5",title:"North and South divided",sub:"How the war pushed the two parts of Ireland further apart",role:"It is 1945 and the war is over. You are comparing what the war meant on each side of the border.",from:"Summary file, 1945",
terms:null,
steps:[
{type:"brief",cards:[
{t:"File 1: Two very different wars",body:"<ul><li>The south did not suffer heavy bombing and huge loss of life, as the north had.</li><li>The economy in the south suffered during the war, whereas the economy in Northern Ireland improved. Rationing in the south only ended several years after the war.</li><li>Northern Ireland’s contribution to the war effort made its ties to Britain even stronger.</li><li>Éire’s neutrality showed the South’s independence, but damaged relations between Éire and Britain and Northern Ireland.</li><li>It took years for the south’s trade links to return to normal.</li></ul>",q:"How did the war affect Northern Ireland’s relationship with Britain?",o:["It made the ties even stronger","It ended the link with Britain","It made no difference"],a:0,why:"Northern Ireland fought alongside Britain, which strengthened unionist ties, while Éire’s neutrality pulled it further away."},
{t:"File 2: Neutral to the very end",body:"<p>When US President Franklin D. Roosevelt died on 12 April 1945, de Valera expressed his condolences. He did the same to the German people when Hitler died on 30 April.</p><p>This was criticised by many, as it appeared that de Valera, and Ireland, did not recognise the horrors that had been committed by Hitler and the Nazis.</p>",q:"Why was de Valera criticised in 1945?",o:["He expressed condolences to the German people when Hitler died","He refused to comment when Roosevelt died","He declared war on Germany"],a:0,why:"He was applying strict neutrality, but it looked as if Ireland ignored the Nazis’ crimes."},
{t:"File 3: Remembering the merchant seamen",body:"<p>During the war, the Irish Mercantile Marine was solely responsible for transporting supplies to and from Ireland. <b>Sixteen ships</b> were lost at sea and <b>150 men</b> died.</p><p>In his speech to the nation after the war, de Valera thanked the men of the mercantile marine for facing ‘all the perils of the ocean’ to bring essential supplies.</p><p>A memorial was unveiled in a park in <b>Irishtown, Dublin</b>, in 1984. In 1991 a newer memorial, the <b>Seaman’s Memorial</b>, was unveiled near Dublin’s docks.</p>",q:"How many Irish seamen died bringing supplies to Ireland during the war?",o:["16","150","1,100"],a:1,why:"16 ships were lost and 150 men died."}
]},
{type:"sort",title:"Éire or Northern Ireland?",lede:"Sort each fact. Some apply to both.",cats:["Éire","Northern Ireland","Both"],items:[
["Stayed neutral during the war",0],["About 1,100 people killed in bombing raids in 1941",1],["The economy suffered during the war",0],["Unemployment fell to only 5%",1],["Glimmer men checked people’s gas use",0],["Base for 120,000 US troops",1],["Petrol mainly used by doctors and priests",0],["Ties with Britain grew even stronger",1],["People used ration books",2],["Bombed by German planes",2],["Shipyards built 140 warships",1],["Rationing lasted several years after the war",0]]},
{type:"write",title:"Your report",report:true,lede:"These are the Checkpoint questions from your textbook. Answer in full sentences, then check.",qs:[
["How did World War II affect the economies of Ireland, north and south?","The south’s economy suffered: imports were cut, factories laid off workers and rationing lasted years after the war. Northern Ireland’s economy boomed: shipyards and aircraft factories expanded and unemployment fell to 5%."],
["Why do you think the link between Northern Ireland and Britain was strengthened by the war?","Northern Ireland fought on Britain’s side, built ships and planes for the war effort, suffered the Blitz and hosted US troops. This shared sacrifice made the bond with Britain stronger."],
["Why did the war push the two parts of Ireland further apart?","They had completely different experiences: the south was neutral, while the north was at war. Neutrality showed the south’s independence but damaged relations with Britain and Northern Ireland."],
["How do you think the war impacted on relations between Ireland and Britain? Give reasons for your answer.","Relations were damaged. Britain resented Ireland’s neutrality, including the refusal of Churchill’s 1940 offer, and de Valera’s condolences on Hitler’s death were heavily criticised. However, Ireland had secretly helped the Allies, so the damage was not total."]]},
{type:"quiz",qs:[
["Whose economy improved during the war?",["Éire’s","Northern Ireland’s","Neither"],1],
["What happened to Northern Ireland’s ties with Britain?",["They became stronger","They were broken","They stayed exactly the same"],0],
["What did de Valera do when Hitler died?",["Ignored it","Expressed condolences to the German people","Celebrated in the Dáil"],1],
["Why was this criticised?",["It seemed Ireland did not recognise the horrors of the Nazis","He had not done the same for Roosevelt","It broke the Emergency Powers Act"],0],
["How many Irish merchant ships were lost during the war?",["6","16","60"],1],
["Where was the 1984 memorial to Irish merchant seamen?",["Irishtown, Dublin","Belfast docks","Cobh"],0],
["When did rationing end in the south?",["In 1945","Several years after the war","It never ended"],1],
["Which of these happened in both parts of Ireland?",["The Belfast Blitz","German bombs fell","Glimmer men"],1]]}
]},

{ref:"Exam",title:"Exam-style question",sub:"The Punch cartoon, 1940",role:"Practise the exam-style question from page 259 of your textbook. Open your book at the cartoon before you start.",from:"Exam practice",terms:null,
steps:[
{type:"brief",cards:[
{t:"The cartoon",body:"<p>This cartoon was published in <b>Punch</b>, a British magazine, in 1940. It is titled <b>‘Eamon defying the lightning’</b>.</p><p>It shows de Valera standing alone on a rocky hilltop in Ireland. He holds up a rolled paper marked ‘Neutrality’ against a dark storm cloud. The cloud is marked with a swastika, and lightning strikes down from it towards him.</p>",q:"What does the swastika on the storm cloud represent?",o:["Nazi Germany","Britain","The IRA"],a:0,why:"The swastika was the symbol of the Nazis, so the storm is the threat from Nazi Germany."},
{t:"Think like a historian",body:"<p>Always ask <b>who made a source and why</b>. Punch was British, and Britain was at war with Germany in 1940. Britain wanted access to the Treaty ports and was frustrated by Irish neutrality.</p><p>‘Defying the lightning’ is a phrase used for someone who is either very brave or very foolish.</p>",q:"Why might a British magazine be critical of Irish neutrality in 1940?",o:["Britain was at war and wanted Ireland’s help","Britain was also neutral","Punch was an Irish magazine"],a:0,why:"A source’s origin shapes its message. This helps you answer part (c) properly."}
]},

    const last=si===m.steps.length-1;
    $("#foot").innerHTML=`<div class="row"><button class="btn" id="cont">${last?"Mission complete: back to all missions":"Continue to "+stepName(m.steps[si+1])}</button></div>`;
    $("#cont").onclick=()=>{pick=null;if(last){S.cur=null}else{S.step[mi]=si+1}save();view(true)}}
  if(top)scrollTo(0,0);
}
refresh=(top)=>{save();const y=scrollY;view(top);if(!top)scrollTo(0,y)};
$("#homeBtn").onclick=()=>{S.cur=null;pick=null;save();view(true)};
view(true);
</script>
</body>
</html>
